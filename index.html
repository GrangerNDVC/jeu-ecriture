<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Archives des Mots - Lexic Rush Évolué</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 30%, #0a0f2a, #020617);
      min-height: 100vh;
      color: #f5e9d3;
      overflow-x: hidden;
      position: relative;
    }
    /* décor animé : bibliothèque magique */
    .magic-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(255,215,130,0.15)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/></radialGradient></defs><rect width="800" height="600" fill="none"/><circle cx="200" cy="150" r="180" fill="url(%23glow)"/><circle cx="600" cy="400" r="250" fill="url(%23glow)"/><path d="M0 500 L800 450 L800 600 L0 600 Z" fill="rgba(30,20,50,0.3)"/><text x="50" y="550" font-size="80" fill="rgba(255,230,170,0.08)" font-family="Georgia">📖</text></svg>');
      background-repeat: no-repeat;
      background-size: cover;
      animation: floatBooks 20s infinite alternate;
    }
    @keyframes floatBooks {
      0% { transform: translateY(0px) scale(1); opacity: 0.6; }
      100% { transform: translateY(-20px) scale(1.05); opacity: 0.9; }
    }
    .glass-panel {
      background: rgba(20, 25, 55, 0.45);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      border: 1px solid rgba(255, 230, 170, 0.3);
      box-shadow: 0 25px 40px -12px rgba(0,0,0,0.4);
    }
    .main-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 1rem;
      position: relative;
      z-index: 2;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      padding: 0.8rem 1.5rem;
      margin-bottom: 1rem;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #FFE6A3, #C7A46B);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .subtitle {
      font-size: 0.7rem;
      opacity: 0.8;
    }
    .hud-right {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .stat {
      background: rgba(0,0,0,0.5);
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .xp-bar-container {
      background: rgba(0,0,0,0.5);
      border-radius: 2rem;
      height: 0.5rem;
      margin: 0.5rem 0 1rem;
      overflow: hidden;
    }
    .xp-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #F3B33D, #FFD966);
      transition: width 0.4s;
    }
    .games-grid {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin: 1rem 0;
    }
    .game-card {
      background: rgba(30, 35, 70, 0.6);
      backdrop-filter: blur(16px);
      border-radius: 1.5rem;
      padding: 1.2rem;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid rgba(255,220,150,0.4);
      width: 240px;
    }
    .game-card:hover {
      transform: scale(1.02);
      border-color: #FFD966;
    }
    .game-container {
      margin-top: 1rem;
      padding: 1rem;
      position: relative;
    }
    .hidden {
      display: none;
    }
    .close-btn {
      position: absolute;
      top: 0.8rem;
      right: 1rem;
      background: rgba(0,0,0,0.7);
      border: none;
      color: #FFE6A3;
      padding: 0.2rem 1rem;
      border-radius: 2rem;
      cursor: pointer;
      z-index: 20;
      font-weight: bold;
    }
    .game-area {
      text-align: center;
    }
    .context {
      background: rgba(0,0,0,0.5);
      border-radius: 1.5rem;
      padding: 0.8rem;
      margin-bottom: 1rem;
    }
    .sentence {
      font-size: 1.2rem;
      font-style: italic;
      margin-bottom: 0.5rem;
    }
    .target-word {
      display: inline-block;
      background: #FFD966;
      color: #1E1B2F;
      padding: 0.2rem 1rem;
      border-radius: 2rem;
      font-weight: bold;
      margin: 0.3rem;
    }
    .instruction {
      font-size: 1.1rem;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      display: inline-block;
      padding: 0.2rem 1.2rem;
      border-radius: 2rem;
    }
    .game-stats {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin: 0.5rem 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .game-canvas {
      position: relative;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 2rem;
      min-height: 400px;
      overflow: hidden;
      margin: 0.5rem 0;
      border: 2px solid rgba(255,215,0,0.5);
      cursor: crosshair;
    }
    .bubble {
      position: absolute;
      background: radial-gradient(circle at 30% 30%, rgba(255,230,150,0.95), rgba(200,160,80,0.85));
      backdrop-filter: blur(4px);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      text-align: center;
      padding: 0.5rem 1rem;
      color: #1E1B2F;
      font-size: 0.9rem;
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.05s;
      border: 1px solid #FFD966;
      white-space: nowrap;
    }
    .bubble:active {
      transform: scale(0.95);
    }
    .timer-bar {
      height: 8px;
      background: #FFD966;
      width: 100%;
      border-radius: 4px;
      transition: width 0.1s linear;
      margin-top: 0.5rem;
    }
    button {
      background: #D4AF37;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-weight: bold;
      margin: 0.5rem;
      cursor: pointer;
    }
    .progress {
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    .zoom-transition {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 3rem;
      font-weight: bold;
      background: rgba(0,0,0,0.8);
      padding: 1rem 2rem;
      border-radius: 3rem;
      color: #FFD966;
      white-space: nowrap;
      z-index: 1000;
      animation: zoomFade 0.8s forwards;
      pointer-events: none;
    }
    @keyframes zoomFade {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; visibility: hidden; }
    }
    /* toggle musique */
    .music-btn {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: rgba(0,0,0,0.6);
      border-radius: 2rem;
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
      z-index: 100;
      cursor: pointer;
    }
    @media (max-width: 700px) {
      .sentence { font-size: 0.9rem; }
      .bubble { font-size: 0.7rem; padding: 0.3rem 0.7rem; white-space: normal; }
      .game-canvas { min-height: 320px; }
      .zoom-transition { font-size: 1.8rem; white-space: normal; width: 80%; text-align: center; }
    }
  </style>
</head>
<body>
<div class="magic-bg"></div>
<main class="main-container">
  <header class="hud glass-panel">
    <div><h1 class="logo">📖 ARCHIVES DES MOTS</h1><p class="subtitle">Lexic Rush - Points bonus pour les mots rares !</p></div>
    <div class="hud-right">
      <div class="stat">⭐ Niv <span id="level">1</span></div>
      <div class="stat">✨ XP <span id="xp">0</span></div>
      <div class="stat">🔥 Combo <span id="combo">0</span></div>
      <div class="stat">⚡ Série <span id="streak">0</span></div>
      <div class="stat">🪙 Pièces <span id="coins">0</span></div>
    </div>
  </header>
  <div class="xp-bar-container"><div class="xp-bar-fill" id="xpBarFill"></div></div>

  <div class="games-grid">
    <div class="game-card" data-game="lexicrush_evolved">
      <h2>🔫 LEXIC RUSH ÉVOLUÉ</h2>
      <p>Phrases, consignes variées, 10 manches</p>
      <span class="badge-game" style="background:#C49A6C;">+ Points rares</span>
    </div>
    <div class="game-card" style="opacity:0.5;">
      <h2>📜 Autres jeux</h2>
      <p>Bientôt</p>
    </div>
  </div>

  <div id="gameContainer" class="game-container hidden glass-panel">
    <button id="closeGameBtn" class="close-btn">✕ Fermer</button>
    <div id="gameInterface"></div>
  </div>
</main>
<div id="musicToggle" class="music-btn">🎵 Musique ON</div>

<script>
  // --------------------------------------------------------------
  // 1. STORAGE (XP, niveau, pièces...)
  // --------------------------------------------------------------
  const STORAGE_KEYS = { XP:'archives_xp', LEVEL:'archives_level', COMBO:'archives_combo', STREAK:'archives_streak', COINS:'archives_coins' };
  const Storage = {
    getXP:()=>parseInt(localStorage.getItem(STORAGE_KEYS.XP)||'0'),
    setXP:(x)=>localStorage.setItem(STORAGE_KEYS.XP,x),
    getLevel:()=>parseInt(localStorage.getItem(STORAGE_KEYS.LEVEL)||'1'),
    setLevel:(l)=>localStorage.setItem(STORAGE_KEYS.LEVEL,l),
    getCombo:()=>parseInt(localStorage.getItem(STORAGE_KEYS.COMBO)||'0'),
    setCombo:(c)=>localStorage.setItem(STORAGE_KEYS.COMBO,c),
    getStreak:()=>parseInt(localStorage.getItem(STORAGE_KEYS.STREAK)||'0'),
    setStreak:(s)=>localStorage.setItem(STORAGE_KEYS.STREAK,s),
    getCoins:()=>parseInt(localStorage.getItem(STORAGE_KEYS.COINS)||'0'),
    setCoins:(c)=>localStorage.setItem(STORAGE_KEYS.COINS,c),
    addReward:(xpGain, coinGain, comboInc=1)=>{
      let xp=Storage.getXP()+xpGain, coins=Storage.getCoins()+coinGain, combo=Storage.getCombo()+comboInc, streak=Storage.getStreak()+1;
      let newLevel=1+Math.floor(xp/100);
      Storage.setXP(xp); Storage.setCoins(coins); Storage.setCombo(combo); Storage.setStreak(streak); Storage.setLevel(newLevel);
      return {xp,coins,combo,streak,level:newLevel};
    },
    resetCombo:()=>Storage.setCombo(0)
  };
  function refreshHUD(){
    document.getElementById('level').innerText=Storage.getLevel();
    document.getElementById('xp').innerText=Storage.getXP();
    document.getElementById('combo').innerText=Storage.getCombo();
    document.getElementById('streak').innerText=Storage.getStreak();
    document.getElementById('coins').innerText=Storage.getCoins();
    let xp=Storage.getXP();
    document.getElementById('xpBarFill').style.width = `${xp%100}%`;
  }
  function showGameContainer(show){ document.getElementById('gameContainer').classList.toggle('hidden',!show); }

  // --------------------------------------------------------------
  // 2. AUDIO (Web Audio - musique dynamique et bruitages)
  // --------------------------------------------------------------
  let audioCtx = null;
  let musicGain = null;
  let musicInterval = null;
  let musicEnabled = true;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.3;
    musicGain.connect(audioCtx.destination);
  }

  function playSound(type) {
    if (!audioCtx) initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    switch(type) {
      case 'success':
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now+0.5);
        osc.start();
        osc.stop(now+0.3);
        break;
      case 'fail':
        osc.frequency.value = 440;
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now+0.6);
        osc.start();
        osc.stop(now+0.4);
        break;
      case 'roundwin':
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.frequency.value = 660;
        gain2.gain.setValueAtTime(0.25, now);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now+0.8);
        osc2.start();
        osc2.stop(now+0.7);
        setTimeout(()=>{ const o=audioCtx.createOscillator(); o.connect(audioCtx.destination); o.frequency.value=880; o.start(); o.stop(now+0.9); }, 400);
        break;
      case 'victory':
        for(let i=0;i<3;i++){
          setTimeout(()=>{
            const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value=523+ i*200;
            g.gain.setValueAtTime(0.2, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.5);
            o.start(); o.stop(audioCtx.currentTime+0.4);
          }, i*200);
        }
        break;
    }
  }

  function startBackgroundMusic() {
    if (!musicEnabled) return;
    if (musicInterval) clearInterval(musicInterval);
    if (!audioCtx) initAudio();
    if (!audioCtx) return;
    // Petite mélodie classique rythmée (style Vivaldi / baroque)
    const notes = [523, 587, 659, 523, 440, 493, 523, 587, 659, 698, 784, 659, 587, 523];
    let idx = 0;
    function playNote() {
      if (!musicEnabled) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(musicGain);
      osc.frequency.value = notes[idx % notes.length];
      gainNode.gain.setValueAtTime(0.08, now);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, now+0.35);
      osc.start();
      osc.stop(now+0.3);
      idx++;
    }
    musicInterval = setInterval(playNote, 380);
  }

  function stopBackgroundMusic() {
    if (musicInterval) clearInterval(musicInterval);
    musicInterval = null;
  }

  function toggleMusic() {
    musicEnabled = !musicEnabled;
    const btn = document.getElementById('musicToggle');
    if (musicEnabled) {
      startBackgroundMusic();
      btn.innerHTML = "🎵 Musique ON";
    } else {
      stopBackgroundMusic();
      btn.innerHTML = "🔇 Musique OFF";
    }
  }

  // --------------------------------------------------------------
  // 3. BASE DE DONNÉES (avec points variables)
  //    plus le mot est rare, plus il rapporte de points
  // --------------------------------------------------------------
  const questionBank = [
    { sentence: "Il court très rapidement.", highlight: "rapidement", type: "synonymes", corrects: ["vite","vivement"], wrongs: ["lentement","doucement"], rareBonus: [0,5] }, // "vivement" +5pts
    { sentence: "Elle est vraiment contente aujourd'hui.", highlight: "contente", type: "synonymes", corrects: ["heureuse","satisfaite","ravie"], wrongs: ["triste","fâchée"], rareBonus: [0,0,8] },
    { sentence: "Ce garçon est très beau.", highlight: "beau", type: "synonymes", corrects: ["magnifique","splendide","joli"], wrongs: ["laid","moche"], rareBonus: [5,8,0] },
    { sentence: "Il a un petit chien.", highlight: "petit", type: "synonymes", corrects: ["minuscule","miniature","menu"], wrongs: ["grand","énorme"], rareBonus: [5,6,10] },
    { sentence: "Elle parle beaucoup en classe.", highlight: "parle", type: "synonymes", corrects: ["discute","bavarde","converse"], wrongs: ["se tait","murmure"], rareBonus: [0,6,10] },
    { sentence: "C'est un garçon fort.", highlight: "fort", type: "synonymes", corrects: ["puissant","solide","vigoureux"], wrongs: ["faible","fragile"], rareBonus: [5,0,10] },
    { sentence: "Il a fait une grosse erreur.", highlight: "grosse", type: "synonymes", corrects: ["grande","énorme","importante"], wrongs: ["petite","minuscule"], rareBonus: [0,8,4] },
    { sentence: "Elle a une jolie voix.", highlight: "jolie", type: "synonymes", corrects: ["belle","agréable","mélodieuse"], wrongs: ["laide","désagréable"], rareBonus: [0,7,12] },
    { sentence: "Il est très intelligent.", highlight: "intelligent", type: "synonymes", corrects: ["malin","brillant","astucieux"], wrongs: ["bête","stupide"], rareBonus: [5,8,12] },
    { sentence: "Cet exercice est facile.", highlight: "facile", type: "synonymes", corrects: ["simple","aisé","élémentaire"], wrongs: ["difficile","compliqué"], rareBonus: [0,6,10] },
    { sentence: "Il a un air triste.", highlight: "triste", type: "synonymes", corrects: ["morose","désolé","affligé"], wrongs: ["joyeux","heureux"], rareBonus: [8,6,12] },
    { sentence: "Cette histoire est étrange.", highlight: "étrange", type: "synonymes", corrects: ["bizarre","curieux","inexpliqué"], wrongs: ["normal","commun"], rareBonus: [6,8,15] },
    // Antonymes
    { sentence: "Il n'est jamais en retard.", highlight: "retard", type: "antonymes", corrects: ["avance","ponctualité"], wrongs: ["lenteur","absence"], rareBonus: [5,10] },
    { sentence: "La pièce est sombre.", highlight: "sombre", type: "antonymes", corrects: ["clair","lumineux","éclatant"], wrongs: ["obscur","noir"], rareBonus: [4,8,12] },
    { sentence: "Il a perdu ses clés.", highlight: "perdu", type: "antonymes", corrects: ["trouvé","retrouvé"], wrongs: ["égaré","caché"], rareBonus: [7,10] },
    // Famille
    { sentence: "Il aime la nature.", highlight: "nature", type: "famille", corrects: ["naturel","naturaliste","naturellement"], wrongs: ["artificiel","culture"], rareBonus: [5,12,10] },
    { sentence: "Elle pratique la natation.", highlight: "natation", type: "famille", corrects: ["nager","nageur","nageoire"], wrongs: ["courir","sauter"], rareBonus: [4,7,12] },
    // Champ lexical
    { sentence: "La forêt est profonde.", highlight: "forêt", type: "champ lexical", corrects: ["arbre","feuille","branche","sous-bois"], wrongs: ["océan","désert"], rareBonus: [0,6,8,12] },
    { sentence: "Le pirate cherche un trésor.", highlight: "pirate", type: "champ lexical", corrects: ["bateau","épée","carte","île"], wrongs: ["avion","voiture"], rareBonus: [5,7,9,10] },
  ];
  // Ajout de mots courants
  const common = [
    { sentence: "Il est très gentil.", highlight: "gentil", type: "synonymes", corrects: ["aimable","sympathique","bienveillant"], wrongs: ["méchant","désagréable"], rareBonus: [0,4,10] },
    { sentence: "Elle a une belle maison.", highlight: "belle", type: "synonymes", corrects: ["magnifique","superbe","splendide"], wrongs: ["laide","moche"], rareBonus: [5,7,10] },
    { sentence: "Il dit toujours la vérité.", highlight: "dit", type: "synonymes", corrects: ["déclare","affirme","exprime"], wrongs: ["ment","cache"], rareBonus: [6,8,12] },
    { sentence: "Elle fait ses devoirs.", highlight: "fait", type: "synonymes", corrects: ["réalise","accomplit","effectue"], wrongs: ["défait","rate"], rareBonus: [5,7,10] },
    { sentence: "Il a une voiture rapide.", highlight: "rapide", type: "synonymes", corrects: ["véloce","vif","prompt"], wrongs: ["lent","paresseux"], rareBonus: [5,7,9] },
  ];
  const FINAL_BANK = [...questionBank, ...common];
  // Duplication pour atteindre ~50
  while(FINAL_BANK.length < 50) FINAL_BANK.push({...FINAL_BANK[Math.floor(Math.random()*FINAL_BANK.length)]});

  // --------------------------------------------------------------
  // 4. JEU PRINCIPAL
  // --------------------------------------------------------------
  const LexicRushEvolved = {
    gameActive: false,
    currentRoundIndex: 0,
    rounds: [],
    roundData: null,
    remainingCorrects: [], // objets {word, bonusPoints}
    score: 0,
    combo: 0,
    timeLeft: 25,
    bubbles: [],
    canvasElem: null,
    gameLoop: null,
    spawnInterval: null,
    timerInterval: null,
    onReward: null,
    container: null,

    async launch(containerEl, onReward) {
      this.container = containerEl;
      this.onReward = onReward;
      this.initGame();
      this.renderUI();
      this.startRound();
    },

    initGame() {
      const shuffled = [...FINAL_BANK];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      this.rounds = shuffled.slice(0, 10);
      this.currentRoundIndex = 0;
      this.score = 0;
      this.combo = 0;
      this.gameActive = true;
    },

    renderUI() {
      this.container.innerHTML = `
        <div class="game-area">
          <div class="context">
            <div class="sentence" id="sentence"></div>
            <div>Mot clé : <span class="target-word" id="highlightWord"></span></div>
            <div class="instruction" id="instruction"></div>
          </div>
          <div class="game-stats">
            <span>🎯 Manche <span id="roundNum">1</span>/10</span>
            <span>💥 Score: <span id="gameScore">0</span></span>
            <span>🔥 Combo: <span id="gameCombo">0</span></span>
            <span>⏱️ Temps: <span id="gameTimer">25</span></span>
          </div>
          <div class="timer-bar" id="timerBar" style="width:100%"></div>
          <div id="gameCanvas" class="game-canvas" style="height:400px; position:relative;"></div>
          <div class="progress">✅ Bonnes réponses restantes : <span id="remainingCount">0</span></div>
          <button id="skipRoundBtn">⏩ Passer manche (pénalité)</button>
        </div>
      `;
      this.canvasElem = document.getElementById('gameCanvas');
      document.getElementById('skipRoundBtn').onclick = () => this.skipRound();
    },

    startRound() {
      if (this.currentRoundIndex >= this.rounds.length) {
        this.endGame(true);
        return;
      }
      if (!this.gameActive) return;
      this.clearBubbles();
      if (this.spawnInterval) clearInterval(this.spawnInterval);
      if (this.timerInterval) clearInterval(this.timerInterval);
      if (this.gameLoop) cancelAnimationFrame(this.gameLoop);

      this.roundData = this.rounds[this.currentRoundIndex];
      const { sentence, highlight, type, corrects, wrongs, rareBonus } = this.roundData;
      let instructionText = "";
      if (type === "synonymes") instructionText = `Trouvez ${corrects.length} synonyme(s) de « ${highlight} »`;
      else if (type === "antonymes") instructionText = `Trouvez ${corrects.length} antonyme(s) de « ${highlight} »`;
      else if (type === "famille") instructionText = `Trouvez ${corrects.length} mot(s) de la même famille que « ${highlight} »`;
      else if (type === "champ lexical") instructionText = `Trouvez ${corrects.length} mot(s) du champ lexical de « ${highlight} »`;

      document.getElementById('sentence').innerText = sentence;
      document.getElementById('highlightWord').innerText = highlight;
      document.getElementById('instruction').innerText = instructionText;
      document.getElementById('roundNum').innerText = this.currentRoundIndex+1;
      document.getElementById('gameScore').innerText = this.score;
      document.getElementById('gameCombo').innerText = this.combo;

      // Stocker les corrects avec leurs bonus
      this.remainingCorrects = corrects.map((word, idx) => ({
        word: word,
        bonus: (rareBonus && rareBonus[idx]) ? rareBonus[idx] : 0
      }));
      this.updateRemainingUI();
      this.timeLeft = 25;
      this.updateTimerUI();

      // Effet zoom sur le changement de consigne
      this.showZoomText(instructionText);

      this.timerInterval = setInterval(() => {
        if (!this.gameActive) return;
        this.timeLeft -= 0.1;
        this.updateTimerUI();
        if (this.timeLeft <= 0) {
          this.roundFailure();
        }
      }, 100);

      this.spawnInterval = setInterval(() => {
        if (this.gameActive) this.spawnBubble();
      }, 900);

      this.animate();
    },

    showZoomText(text) {
      const div = document.createElement('div');
      div.className = 'zoom-transition';
      div.innerText = text;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 800);
    },

    updateTimerUI() {
      const timerElem = document.getElementById('gameTimer');
      if (timerElem) timerElem.innerText = Math.ceil(this.timeLeft);
      const percent = (this.timeLeft / 25) * 100;
      const bar = document.getElementById('timerBar');
      if (bar) bar.style.width = `${Math.max(0, percent)}%`;
    },

    updateRemainingUI() {
      const span = document.getElementById('remainingCount');
      if (span) span.innerText = this.remainingCorrects.length;
    },

    spawnBubble() {
      if (!this.gameActive) return;
      const { corrects, wrongs } = this.roundData;
      let isCorrect = false;
      let word = "";
      let bonusPoints = 0;
      if (this.remainingCorrects.length > 0 && Math.random() < 0.6) {
        isCorrect = true;
        const idx = Math.floor(Math.random() * this.remainingCorrects.length);
        word = this.remainingCorrects[idx].word;
        bonusPoints = this.remainingCorrects[idx].bonus;
      } else {
        isCorrect = false;
        const idx = Math.floor(Math.random() * wrongs.length);
        word = wrongs[idx];
      }
      const canvasRect = this.canvasElem.getBoundingClientRect();
      const leftPos = Math.random() * (canvasRect.width - 100);
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerText = word;
      bubble.style.left = `${leftPos}px`;
      bubble.style.bottom = '0px';
      bubble.style.position = 'absolute';
      bubble.dataset.isCorrect = isCorrect ? "true" : "false";
      bubble.dataset.word = word;
      bubble.dataset.bonus = bonusPoints;
      bubble.onclick = (e) => {
        e.stopPropagation();
        this.shootBubble(bubble);
      };
      bubble.ontouchstart = (e) => {
        e.preventDefault();
        this.shootBubble(bubble);
      };
      this.canvasElem.appendChild(bubble);
      this.bubbles.push({ element: bubble, y: 0, speed: 1.2 + Math.random() * 1.3, word, isCorrect, bonus: bonusPoints });
    },

    shootBubble(bubbleElem) {
      if (!this.gameActive) return;
      const isCorrect = bubbleElem.dataset.isCorrect === "true";
      const word = bubbleElem.dataset.word;
      const bonus = parseInt(bubbleElem.dataset.bonus) || 0;
      if (isCorrect) {
        const index = this.remainingCorrects.findIndex(item => item.word === word);
        if (index !== -1) {
          this.remainingCorrects.splice(index, 1);
          let basePoints = 10 + Math.floor(this.combo * 2);
          let totalPoints = basePoints + bonus;
          this.score += totalPoints;
          this.combo++;
          this.addFeedback(bubbleElem, `+${totalPoints}`, '#8BC34A');
          playSound('success');
          if (this.onReward) this.onReward(5 + Math.floor(bonus/2), 2, false);
          refreshHUD();
          this.updateUIStats();
          this.updateRemainingUI();
          if (this.remainingCorrects.length === 0) {
            this.roundSuccess();
            return;
          }
        } else {
          this.combo = 0;
          this.addFeedback(bubbleElem, 'Déjà trouvé !', '#FFA500');
          playSound('fail');
          if (this.onReward) this.onReward(0,0,true);
          refreshHUD();
          this.updateUIStats();
        }
      } else {
        this.combo = 0;
        this.addFeedback(bubbleElem, 'Mauvais !', '#E57373');
        playSound('fail');
        if (this.onReward) this.onReward(0,0,true);
        refreshHUD();
        this.updateUIStats();
      }
      const idx = this.bubbles.findIndex(b => b.element === bubbleElem);
      if (idx !== -1) {
        this.bubbles[idx].element.remove();
        this.bubbles.splice(idx, 1);
      }
    },

    roundSuccess() {
      if (!this.gameActive) return;
      let bonus = 20;
      this.score += bonus;
      this.updateUIStats();
      this.addGlobalFeedback(`Manche réussie ! +${bonus} points`, '#FFD966');
      playSound('roundwin');
      if (this.onReward) this.onReward(15, 5, false);
      refreshHUD();
      this.nextRound();
    },

    roundFailure() {
      if (!this.gameActive) return;
      this.addGlobalFeedback("Temps écoulé ! Manche perdue...", '#E57373');
      playSound('fail');
      if (this.onReward) this.onReward(0, 0, true);
      refreshHUD();
      this.nextRound();
    },

    skipRound() {
      if (!this.gameActive) return;
      this.addGlobalFeedback("Manche passée (pénalité : -5 points)", '#FFA500');
      this.score = Math.max(0, this.score - 5);
      this.combo = 0;
      this.updateUIStats();
      playSound('fail');
      if (this.onReward) this.onReward(0,0,true);
      refreshHUD();
      this.nextRound();
    },

    nextRound() {
      this.clearBubbles();
      if (this.spawnInterval) clearInterval(this.spawnInterval);
      if (this.timerInterval) clearInterval(this.timerInterval);
      if (this.gameLoop) cancelAnimationFrame(this.gameLoop);
      this.currentRoundIndex++;
      if (this.currentRoundIndex < this.rounds.length) {
        this.startRound();
      } else {
        this.endGame(true);
      }
    },

    updateUIStats() {
      const scoreElem = document.getElementById('gameScore');
      const comboElem = document.getElementById('gameCombo');
      if (scoreElem) scoreElem.innerText = this.score;
      if (comboElem) comboElem.innerText = this.combo;
    },

    addFeedback(element, text, color) {
      const rect = element.getBoundingClientRect();
      const feedback = document.createElement('div');
      feedback.innerText = text;
      feedback.style.position = 'fixed';
      feedback.style.left = `${rect.left + rect.width/2}px`;
      feedback.style.top = `${rect.top}px`;
      feedback.style.color = color;
      feedback.style.fontWeight = 'bold';
      feedback.style.fontSize = '1.3rem';
      feedback.style.textShadow = '0 0 3px black';
      feedback.style.pointerEvents = 'none';
      feedback.style.zIndex = '1000';
      feedback.style.animation = 'fadeUp 0.5s ease-out';
      document.body.appendChild(feedback);
      setTimeout(() => feedback.remove(), 500);
    },

    addGlobalFeedback(text, color) {
      const feedback = document.createElement('div');
      feedback.innerText = text;
      feedback.style.position = 'fixed';
      feedback.style.top = '50%';
      feedback.style.left = '50%';
      feedback.style.transform = 'translate(-50%, -50%)';
      feedback.style.backgroundColor = 'rgba(0,0,0,0.7)';
      feedback.style.padding = '0.5rem 1rem';
      feedback.style.borderRadius = '2rem';
      feedback.style.color = color;
      feedback.style.fontWeight = 'bold';
      feedback.style.zIndex = '2000';
      feedback.style.fontSize = '1.2rem';
      feedback.style.whiteSpace = 'nowrap';
      document.body.appendChild(feedback);
      setTimeout(() => feedback.remove(), 1500);
    },

    clearBubbles() {
      for (let b of this.bubbles) {
        if (b.element && b.element.parentNode) b.element.remove();
      }
      this.bubbles = [];
    },

    animate() {
      if (!this.gameActive) return;
      for (let i = 0; i < this.bubbles.length; i++) {
        const b = this.bubbles[i];
        b.y += b.speed;
        b.element.style.bottom = `${b.y}px`;
        if (b.y > this.canvasElem.clientHeight + 100) {
          b.element.remove();
          this.bubbles.splice(i, 1);
          i--;
        }
      }
      this.gameLoop = requestAnimationFrame(() => this.animate());
    },

    endGame(isVictory) {
      this.gameActive = false;
      this.clearBubbles();
      if (this.spawnInterval) clearInterval(this.spawnInterval);
      if (this.timerInterval) clearInterval(this.timerInterval);
      if (this.gameLoop) cancelAnimationFrame(this.gameLoop);
      let message = isVictory ? "🏆 VICTOIRE ! Vous avez terminé les 10 manches !" : "⛔ Partie interrompue.";
      let bonusXP = 0, bonusCoins = 0;
      if (isVictory) {
        bonusXP = 100;
        bonusCoins = 50;
        if (this.onReward) this.onReward(bonusXP, bonusCoins, false);
        playSound('victory');
        refreshHUD();
      }
      this.container.innerHTML += `<div style="text-align:center; margin-top:1rem;"><p>${message}</p><p>Score final : ${this.score}</p><button id="playAgainEvolvedBtn">🔁 Rejouer</button></div>`;
      document.getElementById('playAgainEvolvedBtn')?.addEventListener('click',() => {
        this.initGame();
        this.renderUI();
        this.startRound();
      });
    }
  };

  // --------------------------------------------------------------
  // 5. APPLICATION PRINCIPALE
  // --------------------------------------------------------------
  const App = {
    init() {
      refreshHUD();
      this.bindCard();
      document.getElementById('closeGameBtn').onclick = () => showGameContainer(false);
      const style = document.createElement('style');
      style.textContent = `@keyframes fadeUp { 0% { opacity:1; transform: translateY(0); } 100% { opacity:0; transform: translateY(-40px); } }`;
      document.head.appendChild(style);
      // Initialiser l'audio au premier clic utilisateur (règle navigateur)
      document.body.addEventListener('click', () => {
        if (!audioCtx) {
          initAudio();
          startBackgroundMusic();
        }
      }, { once: true });
      document.getElementById('musicToggle').onclick = () => toggleMusic();
    },
    bindCard() {
      const card = document.querySelector('.game-card[data-game="lexicrush_evolved"]');
      if (card) card.addEventListener('click', () => this.startEvolved());
    },
    startEvolved() {
      showGameContainer(true);
      const container = document.getElementById('gameInterface');
      LexicRushEvolved.launch(container, (xpGain, coinGain, isFail) => {
        if (isFail) Storage.resetCombo();
        else Storage.addReward(xpGain, coinGain, isFail ? 0 : 1);
        refreshHUD();
      });
    }
  };
  document.addEventListener('DOMContentLoaded', () => App.init());
</script>
