<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Archives des Mots - Lexic Rush</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js" defer></script>
</head>
<body>
<div class="magic-bg">
  <div class="light-spot" style="top:10%; left:5%;"></div>
  <div class="light-spot" style="bottom:10%; right:5%; width:400px; height:400px;"></div>
  <div class="floating-book" style="top:15%; left:80%;">📖</div>
  <div class="floating-book" style="top:60%; left:10%; animation-duration: 20s;">📚</div>
  <div class="floating-book" style="top:30%; left:40%; animation-duration: 18s;">🔮</div>
  <div class="floating-book" style="bottom:20%; left:70%;">✨</div>
</div>

<main class="main-container">
  <header class="hud glass-panel">
    <div>
      <h1 class="logo">📖 ARCHIVES DES MOTS</h1>
      <p class="subtitle">Lexic Rush - Attention : mauvais mot = -5 points</p>
    </div>
    <div class="hud-right">
      <div class="stat">⭐ Niv <span id="level">1</span></div>
      <div class="stat">✨ XP <span id="xp">0</span></div>
      <div class="stat">🔥 Combo <span id="combo">0</span></div>
      <div class="stat">⚡ Série <span id="streak">0</span></div>
      <div class="stat">🪙 Pièces <span id="coins">0</span></div>
    </div>
  </header>
  <div class="xp-bar-container">
    <div class="xp-bar-fill" id="xpBarFill"></div>
  </div>

  <div class="games-grid">
    <div class="game-card" data-game="lexicrush">
      <h2>🔫 LEXIC RUSH ÉVOLUÉ</h2>
      <p>Phrases, consignes variées, 10 manches</p>
      <span class="badge-game">+ Points rares / -5 si erreur</span>
    </div>
    <div class="game-card" style="opacity:0.5;">
      <h2>📜 Autres jeux</h2>
      <p>Bientôt</p>
    </div>
  </div>

  <div id="gameContainer" class="game-container hidden glass-panel">
    <button id="closeGameBtn" class="close-btn">✕ Fermer</button>
    <div id="gameInterface"></div>
  </div>
</main>

<div id="musicToggle" class="music-btn">🎵 Musique ON</div>
</body>
</html>
