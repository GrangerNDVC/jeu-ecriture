<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Archives des Mots - Lexic Rush Évolué</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 10% 20%, #0a0f2a, #030617);
      min-height: 100vh;
      color: #f5e9d3;
      overflow-x: hidden;
    }
    .magic-dust {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: radial-gradient(circle at 20% 40%, rgba(255,215,130,0.2) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: floatDust 30s linear infinite;
    }
    @keyframes floatDust {
      0% { background-position: 0 0; }
      100% { background-position: 100px 100px; }
    }
    .glass-panel {
      background: rgba(20, 25, 55, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      border: 1px solid rgba(255, 230, 170, 0.3);
      box-shadow: 0 25px 40px -12px rgba(0,0,0,0.4);
    }
    .main-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 1rem;
      position: relative;
      z-index: 2;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      padding: 0.8rem 1.5rem;
      margin-bottom: 1rem;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #FFE6A3, #C7A46B);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .subtitle {
      font-size: 0.7rem;
      opacity: 0.8;
    }
    .hud-right {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .stat {
      background: rgba(0,0,0,0.5);
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .xp-bar-container {
      background: rgba(0,0,0,0.5);
      border-radius: 2rem;
      height: 0.5rem;
      margin: 0.5rem 0 1rem;
      overflow: hidden;
    }
    .xp-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #F3B33D, #FFD966);
      transition: width 0.4s;
    }
    .games-grid {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin: 1rem 0;
    }
    .game-card {
      background: rgba(30, 35, 70, 0.6);
      backdrop-filter: blur(16px);
      border-radius: 1.5rem;
      padding: 1.2rem;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid rgba(255,220,150,0.4);
      width: 240px;
    }
    .game-card:hover {
      transform: scale(1.02);
      border-color: #FFD966;
    }
    .game-container {
      margin-top: 1rem;
      padding: 1rem;
      position: relative;
    }
    .hidden {
      display: none;
    }
    .close-btn {
      position: absolute;
      top: 0.8rem;
      right: 1rem;
      background: rgba(0,0,0,0.7);
      border: none;
      color: #FFE6A3;
      padding: 0.2rem 1rem;
      border-radius: 2rem;
      cursor: pointer;
      z-index: 20;
      font-weight: bold;
    }
    .game-area {
      text-align: center;
    }
    .context {
      background: rgba(0,0,0,0.5);
      border-radius: 1.5rem;
      padding: 0.8rem;
      margin-bottom: 1rem;
    }
    .sentence {
      font-size: 1.2rem;
      font-style: italic;
      margin-bottom: 0.5rem;
    }
    .target-word {
      display: inline-block;
      background: #FFD966;
      color: #1E1B2F;
      padding: 0.2rem 1rem;
      border-radius: 2rem;
      font-weight: bold;
      margin: 0.3rem;
    }
    .instruction {
      font-size: 1.1rem;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      display: inline-block;
      padding: 0.2rem 1.2rem;
      border-radius: 2rem;
    }
    .game-stats {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin: 0.5rem 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .game-canvas {
      position: relative;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 2rem;
      min-height: 400px;
      overflow: hidden;
      margin: 0.5rem 0;
      border: 2px solid rgba(255,215,0,0.5);
      cursor: crosshair;
    }
    .bubble {
      position: absolute;
      background: radial-gradient(circle at 30% 30%, rgba(255,230,150,0.95), rgba(200,160,80,0.85));
      backdrop-filter: blur(4px);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      text-align: center;
      padding: 0.5rem 1rem;
      color: #1E1B2F;
      font-size: 0.9rem;
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.05s;
      border: 1px solid #FFD966;
      white-space: nowrap;
    }
    .bubble:active {
      transform: scale(0.95);
    }
    .timer-bar {
      height: 8px;
      background: #FFD966;
      width: 100%;
      border-radius: 4px;
      transition: width 0.1s linear;
      margin-top: 0.5rem;
    }
    button {
      background: #D4AF37;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-weight: bold;
      margin: 0.5rem;
      cursor: pointer;
    }
    .progress {
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    @media (max-width: 700px) {
      .sentence { font-size: 0.9rem; }
      .bubble { font-size: 0.7rem; padding: 0.3rem 0.7rem; white-space: normal; }
      .game-canvas { min-height: 320px; }
    }
  </style>
</head>
<body>
<div class="magic-dust"></div>
<main class="main-container">
  <header class="hud glass-panel">
    <div><h1 class="logo">📖 ARCHIVES DES MOTS</h1><p class="subtitle">Lexic Rush - Trouvez les bons mots !</p></div>
    <div class="hud-right">
      <div class="stat">⭐ Niv <span id="level">1</span></div>
      <div class="stat">✨ XP <span id="xp">0</span></div>
      <div class="stat">🔥 Combo <span id="combo">0</span></div>
      <div class="stat">⚡ Série <span id="streak">0</span></div>
      <div class="stat">🪙 Pièces <span id="coins">0</span></div>
    </div>
  </header>
  <div class="xp-bar-container"><div class="xp-bar-fill" id="xpBarFill"></div></div>

  <div class="games-grid">
    <div class="game-card" data-game="lexicrush_evolved">
      <h2>🔫 LEXIC RUSH ÉVOLUÉ</h2>
      <p>Phrases, consignes variées, 10 manches</p>
      <span class="badge-game" style="background:#C49A6C;">Nouveau !</span>
    </div>
    <div class="game-card" style="opacity:0.5;">
      <h2>📜 Autres jeux</h2>
      <p>Bientôt</p>
    </div>
  </div>

  <div id="gameContainer" class="game-container hidden glass-panel">
    <button id="closeGameBtn" class="close-btn">✕ Fermer</button>
    <div id="gameInterface"></div>
  </div>
</main>

<script>
  // --------------------------------------------------------------
  // 1. STORAGE (XP, niveau, pièces...)
  // --------------------------------------------------------------
  const STORAGE_KEYS = { XP:'archives_xp', LEVEL:'archives_level', COMBO:'archives_combo', STREAK:'archives_streak', COINS:'archives_coins' };
  const Storage = {
    getXP:()=>parseInt(localStorage.getItem(STORAGE_KEYS.XP)||'0'),
    setXP:(x)=>localStorage.setItem(STORAGE_KEYS.XP,x),
    getLevel:()=>parseInt(localStorage.getItem(STORAGE_KEYS.LEVEL)||'1'),
    setLevel:(l)=>localStorage.setItem(STORAGE_KEYS.LEVEL,l),
    getCombo:()=>parseInt(localStorage.getItem(STORAGE_KEYS.COMBO)||'0'),
    setCombo:(c)=>localStorage.setItem(STORAGE_KEYS.COMBO,c),
    getStreak:()=>parseInt(localStorage.getItem(STORAGE_KEYS.STREAK)||'0'),
    setStreak:(s)=>localStorage.setItem(STORAGE_KEYS.STREAK,s),
    getCoins:()=>parseInt(localStorage.getItem(STORAGE_KEYS.COINS)||'0'),
    setCoins:(c)=>localStorage.setItem(STORAGE_KEYS.COINS,c),
    addReward:(xpGain, coinGain, comboInc=1)=>{
      let xp=Storage.getXP()+xpGain, coins=Storage.getCoins()+coinGain, combo=Storage.getCombo()+comboInc, streak=Storage.getStreak()+1;
      let newLevel=1+Math.floor(xp/100);
      Storage.setXP(xp); Storage.setCoins(coins); Storage.setCombo(combo); Storage.setStreak(streak); Storage.setLevel(newLevel);
      return {xp,coins,combo,streak,level:newLevel};
    },
    resetCombo:()=>Storage.setCombo(0)
  };
  function refreshHUD(){
    document.getElementById('level').innerText=Storage.getLevel();
    document.getElementById('xp').innerText=Storage.getXP();
    document.getElementById('combo').innerText=Storage.getCombo();
    document.getElementById('streak').innerText=Storage.getStreak();
    document.getElementById('coins').innerText=Storage.getCoins();
    let xp=Storage.getXP();
    document.getElementById('xpBarFill').style.width = `${xp%100}%`;
  }
  function showGameContainer(show){ document.getElementById('gameContainer').classList.toggle('hidden',!show); }

  // --------------------------------------------------------------
  // 2. BASE DE DONNÉES (50+ entrées avec phrases, consignes variées)
  // --------------------------------------------------------------
  const questionBank = [
    { sentence: "Il court très rapidement.", highlight: "rapidement", type: "synonymes", corrects: ["vite","vivement"], wrongs: ["lentement","doucement","paresseusement"] },
    { sentence: "Elle est vraiment contente aujourd'hui.", highlight: "contente", type: "synonymes", corrects: ["heureuse","satisfaite","ra vie"], wrongs: ["triste","fâchée","déçue"] },
    { sentence: "Ce garçon est très beau.", highlight: "beau", type: "synonymes", corrects: ["magnifique","splendide","joli"], wrongs: ["laid","moche","hideux"] },
    { sentence: "Il a un petit chien.", highlight: "petit", type: "synonymes", corrects: ["minuscule","miniature","menu"], wrongs: ["grand","énorme","gigantesque"] },
    { sentence: "Elle parle beaucoup en classe.", highlight: "parle", type: "synonymes", corrects: ["discute","bavarde","converse"], wrongs: ["se tait","murmure","crie"] },
    { sentence: "C'est un garçon fort.", highlight: "fort", type: "synonymes", corrects: ["puissant","solide","vigoureux"], wrongs: ["faible","fragile","délicat"] },
    { sentence: "Il a fait une grosse erreur.", highlight: "grosse", type: "synonymes", corrects: ["grande","énorme","importante"], wrongs: ["petite","minuscule","insignifiante"] },
    { sentence: "Elle a une jolie voix.", highlight: "jolie", type: "synonymes", corrects: ["belle","agréable","mélodieuse"], wrongs: ["laide","désagréable","criarde"] },
    { sentence: "Il est très intelligent.", highlight: "intelligent", type: "synonymes", corrects: ["malin","brillant","astucieux"], wrongs: ["bête","stupide","idiot"] },
    { sentence: "Cet exercice est facile.", highlight: "facile", type: "synonymes", corrects: ["simple","aisé","élémentaire"], wrongs: ["difficile","compliqué","ardu"] },
    { sentence: "Il a un air triste.", highlight: "triste", type: "synonymes", corrects: ["morose","désolé","affligé"], wrongs: ["joyeux","heureux","gai"] },
    { sentence: "Cette histoire est étrange.", highlight: "étrange", type: "synonymes", corrects: ["bizarre","curieux","inexpliqué"], wrongs: ["normal","commun","ordinaire"] },
    // Antonymes
    { sentence: "Il n'est jamais en retard.", highlight: "retard", type: "antonymes", corrects: ["avance","ponctualité"], wrongs: ["lenteur","absence"] },
    { sentence: "La pièce est sombre.", highlight: "sombre", type: "antonymes", corrects: ["clair","lumineux","éclatant"], wrongs: ["obscur","noir"] },
    { sentence: "Il a perdu ses clés.", highlight: "perdu", type: "antonymes", corrects: ["trouvé","retrouvé"], wrongs: ["égaré","caché"] },
    { sentence: "Le début du film est long.", highlight: "début", type: "antonymes", corrects: ["fin","conclusion"], wrongs: ["milieu","préambule"] },
    // Mots de la même famille
    { sentence: "Il aime la nature.", highlight: "nature", type: "famille", corrects: ["naturel","naturaliste","naturellement"], wrongs: ["artificiel","culture"] },
    { sentence: "Elle pratique la natation.", highlight: "natation", type: "famille", corrects: ["nager","nageur","nageoire"], wrongs: ["courir","sauter"] },
    { sentence: "Le soleil brille.", highlight: "soleil", type: "famille", corrects: ["solaire","ensoleillé","soleillement"], wrongs: ["lune","étoile"] },
    // Champ lexical (thème)
    { sentence: "La forêt est profonde.", highlight: "forêt", type: "champ lexical", corrects: ["arbre","feuille","branche","sous-bois"], wrongs: ["océan","désert","montagne"] },
    { sentence: "Le pirate cherche un trésor.", highlight: "pirate", type: "champ lexical", corrects: ["bateau","épée","carte","île"], wrongs: ["avion","voiture","train"] },
  ];
  // Dupliquer et enrichir pour atteindre 50+ questions (on va générer des variantes)
  const extendedBank = [...questionBank];
  const commonWords = [
    { sentence: "Il est très gentil.", highlight: "gentil", type: "synonymes", corrects: ["aimable","sympathique","bienveillant"], wrongs: ["méchant","désagréable"] },
    { sentence: "Elle a une belle maison.", highlight: "belle", type: "synonymes", corrects: ["magnifique","superbe","splendide"], wrongs: ["laide","moche"] },
    { sentence: "Il dit toujours la vérité.", highlight: "dit", type: "synonymes", corrects: ["déclare","affirme","exprime"], wrongs: ["ment","cache"] },
    { sentence: "Elle fait ses devoirs.", highlight: "fait", type: "synonymes", corrects: ["réalise","accomplit","effectue"], wrongs: ["défait","rate"] },
    { sentence: "Il a une voiture rapide.", highlight: "rapide", type: "synonymes", corrects: ["véloce","vif","prompt"], wrongs: ["lent","paresseux"] },
    { sentence: "Le professeur est sévère.", highlight: "sévère", type: "antonymes", corrects: ["doux","clément","indulgent"], wrongs: ["dur","strict"] },
    { sentence: "Le chemin est étroit.", highlight: "étroit", type: "antonymes", corrects: ["large","spacieux"], wrongs: ["serré","resserré"] },
    { sentence: "La mer est calme.", highlight: "calme", type: "synonymes", corrects: ["paisible","tranquille","serein"], wrongs: ["agité","orageux"] },
    { sentence: "Il a un grand pouvoir.", highlight: "pouvoir", type: "famille", corrects: ["puissant","puissance","impuissant"], wrongs: ["faible","autorité"] },
    { sentence: "Elle lit un livre.", highlight: "livre", type: "champ lexical", corrects: ["page","chapitre","bibliothèque","roman"], wrongs: ["télévision","ordinateur"] },
  ];
  extendedBank.push(...commonWords);
  // Ajouter encore pour arriver à 50
  for(let i=0; i<20; i++) {
    extendedBank.push({ ...extendedBank[i%extendedBank.length], highlight: extendedBank[i%extendedBank.length].highlight + " variante" });
  }
  const FINAL_BANK = extendedBank.slice(0, 55); // au moins 55

  // --------------------------------------------------------------
  // 3. JEU PRINCIPAL (manches, bulles, consignes variables)
  // --------------------------------------------------------------
  const LexicRushEvolved = {
    gameActive: false,
    currentRoundIndex: 0,
    rounds: [], // liste des questions sélectionnées aléatoirement (10 manches)
    roundData: null,
    remainingCorrects: [], // mots corrects pas encore collectés
    score: 0,
    combo: 0,
    timeLeft: 25,
    bubbles: [],
    canvasElem: null,
    gameLoop: null,
    spawnInterval: null,
    timerInterval: null,
    onReward: null,
    container: null,

    async launch(containerEl, onReward) {
      this.container = containerEl;
      this.onReward = onReward;
      this.initGame();
      this.renderUI();
      this.startRound();
    },

    initGame() {
      // Sélection aléatoire de 10 questions uniques (ou moins si pas assez, mais on a 55)
      const shuffled = [...FINAL_BANK];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      this.rounds = shuffled.slice(0, 10);
      this.currentRoundIndex = 0;
      this.score = 0;
      this.combo = 0;
      this.gameActive = true;
    },

    renderUI() {
      this.container.innerHTML = `
        <div class="game-area">
          <div class="context">
            <div class="sentence" id="sentence"></div>
            <div>Mot clé : <span class="target-word" id="highlightWord"></span></div>
            <div class="instruction" id="instruction"></div>
          </div>
          <div class="game-stats">
            <span>🎯 Manche <span id="roundNum">1</span>/10</span>
            <span>💥 Score: <span id="gameScore">0</span></span>
            <span>🔥 Combo: <span id="gameCombo">0</span></span>
            <span>⏱️ Temps: <span id="gameTimer">25</span></span>
          </div>
          <div class="timer-bar" id="timerBar" style="width:100%"></div>
          <div id="gameCanvas" class="game-canvas" style="height:400px; position:relative;"></div>
          <div class="progress">✅ Bonnes réponses restantes : <span id="remainingCount">0</span></div>
          <button id="skipRoundBtn">⏩ Passer manche (pénalité)</button>
        </div>
      `;
      this.canvasElem = document.getElementById('gameCanvas');
      document.getElementById('skipRoundBtn').onclick = () => this.skipRound();
    },

    startRound() {
      if (this.currentRoundIndex >= this.rounds.length) {
        this.endGame(true);
        return;
      }
      if (!this.gameActive) return;
      // Nettoyer les bulles précédentes
      this.clearBubbles();
      if (this.spawnInterval) clearInterval(this.spawnInterval);
      if (this.timerInterval) clearInterval(this.timerInterval);
      if (this.gameLoop) cancelAnimationFrame(this.gameLoop);

      this.roundData = this.rounds[this.currentRoundIndex];
      const { sentence, highlight, type, corrects, wrongs } = this.roundData;
      // Adapter l'intitulé de la consigne
      let instructionText = "";
      if (type === "synonymes") instructionText = `Trouvez ${corrects.length} synonyme(s) de « ${highlight} »`;
      else if (type === "antonymes") instructionText = `Trouvez ${corrects.length} antonyme(s) de « ${highlight} »`;
      else if (type === "famille") instructionText = `Trouvez ${corrects.length} mot(s) de la même famille que « ${highlight} »`;
      else if (type === "champ lexical") instructionText = `Trouvez ${corrects.length} mot(s) du champ lexical de « ${highlight} »`;
      else instructionText = `Trouvez les mots liés à « ${highlight} »`;

      document.getElementById('sentence').innerText = sentence;
      document.getElementById('highlightWord').innerText = highlight;
      document.getElementById('instruction').innerText = instructionText;
      document.getElementById('roundNum').innerText = this.currentRoundIndex+1;
      document.getElementById('gameScore').innerText = this.score;
      document.getElementById('gameCombo').innerText = this.combo;
      
      this.remainingCorrects = [...corrects];
      this.updateRemainingUI();
      this.timeLeft = 25;
      this.updateTimerUI();

      // Lancer le timer
      this.timerInterval = setInterval(() => {
        if (!this.gameActive) return;
        this.timeLeft -= 0.1;
        this.updateTimerUI();
        if (this.timeLeft <= 0) {
          this.roundFailure();
        }
      }, 100);

      // Lancer le spawn de bulles
      this.spawnInterval = setInterval(() => {
        if (this.gameActive) this.spawnBubble();
      }, 900);

      // Animation
      this.animate();
    },

    updateTimerUI() {
      const timerElem = document.getElementById('gameTimer');
      if (timerElem) timerElem.innerText = Math.ceil(this.timeLeft);
      const percent = (this.timeLeft / 25) * 100;
      const bar = document.getElementById('timerBar');
      if (bar) bar.style.width = `${Math.max(0, percent)}%`;
    },

    updateRemainingUI() {
      const span = document.getElementById('remainingCount');
      if (span) span.innerText = this.remainingCorrects.length;
    },

    spawnBubble() {
      if (!this.gameActive) return;
      const { corrects, wrongs } = this.roundData;
      // 50% de chance de faire apparaître un mot correct restant, sinon un leurre
      let isCorrect = false;
      let word = "";
      if (this.remainingCorrects.length > 0 && Math.random() < 0.6) {
        isCorrect = true;
        const idx = Math.floor(Math.random() * this.remainingCorrects.length);
        word = this.remainingCorrects[idx];
      } else {
        isCorrect = false;
        const idx = Math.floor(Math.random() * wrongs.length);
        word = wrongs[idx];
      }
      const canvasRect = this.canvasElem.getBoundingClientRect();
      const leftPos = Math.random() * (canvasRect.width - 100);
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerText = word;
      bubble.style.left = `${leftPos}px`;
      bubble.style.bottom = '0px';
      bubble.style.position = 'absolute';
      bubble.dataset.isCorrect = isCorrect ? "true" : "false";
      bubble.dataset.word = word;
      bubble.onclick = (e) => {
        e.stopPropagation();
        this.shootBubble(bubble);
      };
      bubble.ontouchstart = (e) => {
        e.preventDefault();
        this.shootBubble(bubble);
      };
      this.canvasElem.appendChild(bubble);
      this.bubbles.push({ element: bubble, y: 0, speed: 1.2 + Math.random() * 1.3, word, isCorrect });
    },

    shootBubble(bubbleElem) {
      if (!this.gameActive) return;
      const isCorrect = bubbleElem.dataset.isCorrect === "true";
      const word = bubbleElem.dataset.word;
      if (isCorrect) {
        // Vérifier que ce mot est bien dans remainingCorrects (sécurité)
        const index = this.remainingCorrects.indexOf(word);
        if (index !== -1) {
          this.remainingCorrects.splice(index, 1);
          // Points et combo
          let points = 10 + Math.floor(this.combo * 2);
          this.score += points;
          this.combo++;
          this.addFeedback(bubbleElem, `+${points}`, '#8BC34A');
          if (this.onReward) this.onReward(5, 2, false);
          refreshHUD();
          this.updateUIStats();
          this.updateRemainingUI();
          // Vérifier si la manche est terminée
          if (this.remainingCorrects.length === 0) {
            this.roundSuccess();
            return;
          }
        } else {
          // déjà pris, on considère comme erreur ?
          this.combo = 0;
          this.addFeedback(bubbleElem, 'Déjà trouvé !', '#FFA500');
          if (this.onReward) this.onReward(0, 0, true);
          refreshHUD();
          this.updateUIStats();
        }
      } else {
        // Mauvais mot
        this.combo = 0;
        this.addFeedback(bubbleElem, 'Mauvais !', '#E57373');
        if (this.onReward) this.onReward(0, 0, true);
        refreshHUD();
        this.updateUIStats();
      }
      // Supprimer la bulle
      const idx = this.bubbles.findIndex(b => b.element === bubbleElem);
      if (idx !== -1) {
        this.bubbles[idx].element.remove();
        this.bubbles.splice(idx, 1);
      }
    },

    roundSuccess() {
      if (!this.gameActive) return;
      // Bonus de fin de manche
      let bonus = 20;
      this.score += bonus;
      this.updateUIStats();
      this.addGlobalFeedback(`Manche réussie ! +${bonus} points`, '#FFD966');
      if (this.onReward) this.onReward(15, 5, false);
      refreshHUD();
      this.nextRound();
    },

    roundFailure() {
      if (!this.gameActive) return;
      this.addGlobalFeedback("Temps écoulé ! Manche perdue...", '#E57373');
      if (this.onReward) this.onReward(0, 0, true);
      refreshHUD();
      this.nextRound();
    },

    skipRound() {
      if (!this.gameActive) return;
      this.addGlobalFeedback("Manche passée (pénalité : -5 points)", '#FFA500');
      this.score = Math.max(0, this.score - 5);
      this.combo = 0;
      this.updateUIStats();
      if (this.onReward) this.onReward(0, 0, true);
      refreshHUD();
      this.nextRound();
    },

    nextRound() {
      // Arrêter tout
      this.clearBubbles();
      if (this.spawnInterval) clearInterval(this.spawnInterval);
      if (this.timerInterval) clearInterval(this.timerInterval);
      if (this.gameLoop) cancelAnimationFrame(this.gameLoop);
      this.currentRoundIndex++;
      if (this.currentRoundIndex < this.rounds.length) {
        this.startRound();
      } else {
        this.endGame(true);
      }
    },

    updateUIStats() {
      const scoreElem = document.getElementById('gameScore');
      const comboElem = document.getElementById('gameCombo');
      if (scoreElem) scoreElem.innerText = this.score;
      if (comboElem) comboElem.innerText = this.combo;
    },

    addFeedback(element, text, color) {
      const rect = element.getBoundingClientRect();
      const feedback = document.createElement('div');
      feedback.innerText = text;
      feedback.style.position = 'fixed';
      feedback.style.left = `${rect.left + rect.width/2}px`;
      feedback.style.top = `${rect.top}px`;
      feedback.style.color = color;
      feedback.style.fontWeight = 'bold';
      feedback.style.fontSize = '1.3rem';
      feedback.style.textShadow = '0 0 3px black';
      feedback.style.pointerEvents = 'none';
      feedback.style.zIndex = '1000';
      feedback.style.animation = 'fadeUp 0.5s ease-out';
      document.body.appendChild(feedback);
      setTimeout(() => feedback.remove(), 500);
    },

    addGlobalFeedback(text, color) {
      const feedback = document.createElement('div');
      feedback.innerText = text;
      feedback.style.position = 'fixed';
      feedback.style.top = '50%';
      feedback.style.left = '50%';
      feedback.style.transform = 'translate(-50%, -50%)';
      feedback.style.backgroundColor = 'rgba(0,0,0,0.7)';
      feedback.style.padding = '0.5rem 1rem';
      feedback.style.borderRadius = '2rem';
      feedback.style.color = color;
      feedback.style.fontWeight = 'bold';
      feedback.style.zIndex = '2000';
      feedback.style.fontSize = '1.2rem';
      feedback.style.whiteSpace = 'nowrap';
      document.body.appendChild(feedback);
      setTimeout(() => feedback.remove(), 1500);
    },

    clearBubbles() {
      for (let b of this.bubbles) {
        if (b.element && b.element.parentNode) b.element.remove();
      }
      this.bubbles = [];
    },

    animate() {
      if (!this.gameActive) return;
      for (let i = 0; i < this.bubbles.length; i++) {
        const b = this.bubbles[i];
        b.y += b.speed;
        b.element.style.bottom = `${b.y}px`;
        if (b.y > this.canvasElem.clientHeight + 100) {
          b.element.remove();
          this.bubbles.splice(i, 1);
          i--;
        }
      }
      this.gameLoop = requestAnimationFrame(() => this.animate());
    },

    endGame(isVictory) {
      this.gameActive = false;
      this.clearBubbles();
      if (this.spawnInterval) clearInterval(this.spawnInterval);
      if (this.timerInterval) clearInterval(this.timerInterval);
      if (this.gameLoop) cancelAnimationFrame(this.gameLoop);
      let message = isVictory ? "🏆 VICTOIRE ! Vous avez terminé les 10 manches !" : "⛔ Partie interrompue.";
      let bonusXP = 0, bonusCoins = 0;
      if (isVictory) {
        bonusXP = 100;
        bonusCoins = 50;
        if (this.onReward) this.onReward(bonusXP, bonusCoins, false);
        refreshHUD();
      }
      this.container.innerHTML += `<div style="text-align:center; margin-top:1rem;"><p>${message}</p><p>Score final : ${this.score}</p><button id="playAgainEvolvedBtn">🔁 Rejouer</button></div>`;
      document.getElementById('playAgainEvolvedBtn')?.addEventListener('click',() => {
        this.initGame();
        this.renderUI();
        this.startRound();
      });
    }
  };

  // --------------------------------------------------------------
  // 4. APPLICATION PRINCIPALE
  // --------------------------------------------------------------
  const App = {
    init() {
      refreshHUD();
      this.bindCard();
      document.getElementById('closeGameBtn').onclick = () => showGameContainer(false);
      const style = document.createElement('style');
      style.textContent = `@keyframes fadeUp { 0% { opacity:1; transform: translateY(0); } 100% { opacity:0; transform: translateY(-40px); } }`;
      document.head.appendChild(style);
    },
    bindCard() {
      const card = document.querySelector('.game-card[data-game="lexicrush_evolved"]');
      if (card) card.addEventListener('click', () => this.startEvolved());
    },
    startEvolved() {
      showGameContainer(true);
      const container = document.getElementById('gameInterface');
      LexicRushEvolved.launch(container, (xpGain, coinGain, isFail) => {
        if (isFail) Storage.resetCombo();
        else Storage.addReward(xpGain, coinGain, isFail ? 0 : 1);
        refreshHUD();
      });
    }
  };
  document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
